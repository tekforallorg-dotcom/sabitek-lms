name: CI

# Runs on every pull request and on pushes to main. main deploys straight to
# production, so this is the automated gate in front of it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p .

      # Fails on any lint error, and if warnings exceed the baseline set in
      # package.json (--max-warnings). The baseline may only go down.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The build only needs these variables to exist; no step here talks to
      # Supabase, Paystack or an AI provider. Real values live in Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: re_placeholder
          ANTHROPIC_API_KEY: placeholder
          GEMINI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
          PAYSTACK_SECRET_KEY: placeholder
          PAYSTACK_PUBLIC_KEY: placeholder
          CRON_SECRET: placeholder
